name: Build Dagster Workspace Images

on:
  push:
    tags:
      - release-dagster-workspace

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/dagster-workspace

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CalVer tag
        id: calver
        run: |
          # Get current date in YYYY.MM.DD format
          DATE=$(date +%Y.%m.%d)

          # Get existing tags for today to determine the build number
          EXISTING_TAGS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/packages/container/dagster-workspace/versions" \
            | jq -r '.[] | select(.metadata.container.tags[]? | startswith("'$DATE'")) | .metadata.container.tags[]' \
            | grep "^$DATE\." | sort -V | tail -1 || echo "")

          if [ -z "$EXISTING_TAGS" ]; then
            # No existing tags for today, start with .0
            BUILD_NUMBER=0
          else
            # Extract the build number and increment
            BUILD_NUMBER=$(echo "$EXISTING_TAGS" | cut -d'.' -f4)
            BUILD_NUMBER=$((BUILD_NUMBER + 1))
          fi

          CALVER_TAG="${DATE}.${BUILD_NUMBER}"
          echo "Generated CalVer tag: $CALVER_TAG"
          echo "calver_tag=$CALVER_TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.calver.outputs.calver_tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=Cloud deployment with BigQuery
            org.opencontainers.image.vendor=Rainbow
            org.opencontainers.image.version=${{ steps.calver.outputs.calver_tag }}
            dagster.environment=cloud
            dagster.calver=${{ steps.calver.outputs.calver_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/dagster_workspace
          file: ./src/dagster_workspace/Dockerfile
          build-args: |
            ENVIRONMENT=cloud
            PYTHON_VERSION=3.12
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Create GitHub tag
        run: |
          # Create a new git tag with the CalVer version
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          TAG_NAME="v${{ steps.calver.outputs.calver_tag }}"
          echo "Creating GitHub tag: $TAG_NAME"

          # Create annotated tag with build information
          git tag -a "$TAG_NAME" -m "Dagster Workspace Release ${{ steps.calver.outputs.calver_tag }}

          🐳 Docker Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.calver.outputs.calver_tag }}
          🏗️  Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          🌍 Environment: cloud
          🐍 Python Version: 3.12
          📦 Triggered by: ${{ github.actor }}
          🔗 Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Push the tag
          git push origin "$TAG_NAME"
          echo "✅ Successfully created and pushed tag: $TAG_NAME"

      - name: Output build information
        run: |
          echo "🚀 Successfully built and pushed Dagster workspace image!"
          echo "📅 CalVer Tag: ${{ steps.calver.outputs.calver_tag }}"
          echo "🏷️  Docker Image Tags:"
          echo "   - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.calver.outputs.calver_tag }}"
          echo "   - ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "🏷️  GitHub Tag: v${{ steps.calver.outputs.calver_tag }}"
