{% set model = dbt_model('dim_authors') %}

cubes:
  - {{ model.as_cube() }}
    dimensions:
      {{ model.as_dimensions() }}
      - name: author_id
        sql: "{CUBE}.author_id"
        type: string
        primary_key: true
        public: true
      - name: author_name
        sql: "{CUBE}.author_name"
        type: string

    measures:
      - name: count
        type: count
        title: Total Authors

    pre_aggregations:
      - name: main
        measures:
          - count
        dimensions:
          - author_id
          - author_name
        time_dimension: created_at
        granularity: day
        indexes:
          - name: author_id_idx
            columns: [author_id]
          - name: author_name_idx
            columns: [author_name]
