{% set model = dbt_model('dim_authors') %}

cubes:
  - {{ model.as_cube() }}
    dimensions:
      {{ model.as_dimensions() }}
      - name: author_id
        sql: "{CUBE}.author_id"
        type: string
        primary_key: true
        public: true
      - name: author_name
        sql: "{CUBE}.author_name"
        type: string

    measures:
      - name: count
        type: count
        title: Total Authors
