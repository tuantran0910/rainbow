cubes:
  - name: top_performance_books
    extends: fct_sales
    dimensions:
      - name: book_title
        sql: "{dim_books.name}"
        type: string
        primary_key: true
        public: true
      - name: created_at
        sql: "CAST({CUBE}.created_date_tz_hcm AS TIMESTAMP)"
        type: time

    measures:
      - name: units_sold
        sql: "{CUBE}.sales_quantity"
        type: sum
      - name: total_revenue
        sql: "{CUBE}.extended_sales_amount"
        type: sum
      - name: avg_rating
        sql: "{dim_books.rating_average}"
        type: avg
      - name: avg_selling_price
        sql: "{CUBE}.net_unit_price"
        type: avg
      - name: distinct_orders
        sql: "{CUBE}.order_id"
        type: count_distinct

    joins:
      - name: dim_books
        relationship: one_to_one
        sql: "{CUBE}.book_key = {dim_books.book_key}"

