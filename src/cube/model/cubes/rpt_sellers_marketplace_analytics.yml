cubes:
  - name: seller_performance
    extends: fct_sales
    dimensions:
      - name: seller_name
        sql: "{dim_sellers.name}"
        type: string
        primary_key: true
        public: true
      - name: created_at
        sql: "CAST({CUBE}.created_date_tz_hcm AS TIMESTAMP)"
        type: time

    measures:
      - name: books_in_catalog
        sql: "{dim_books.id}"
        type: count_distinct
      - name: total_units_sold
        sql: "{CUBE}.sales_quantity"
        type: sum
      - name: total_revenue
        sql: "{CUBE}.extended_sales_amount"
        type: sum
      - name: avg_book_rating
        sql: "{dim_books.rating_average}"
        type: avg
      - name: unique_customers
        sql: "{dim_users.id}"
        type: count_distinct
      - name: revenue_per_customer
        sql: "SUM({CUBE}.extended_sales_amount) / COUNT(DISTINCT {dim_users.id})"
        type: number

    joins:
      - name: dim_books
        relationship: one_to_one
        sql: "{CUBE}.book_key = {dim_books.book_key}"
      - name: dim_sellers
        relationship: one_to_one
        sql: "{CUBE}.seller_key = {dim_sellers.seller_key}"
      - name: dim_users
        relationship: one_to_one
        sql: "{CUBE}.user_key = {dim_users.user_key}"

