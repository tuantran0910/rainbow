cubes:
  - name: author_performance
    extends: bri_book_authors
    dimensions:
      - name: author_id
        sql: "{CUBE}.author_id"
        type: string
        primary_key: true
        public: true
      - name: author_name
        sql: "{dim_authors.name}"
        type: string

    measures:
      - name: books_published
        sql: "{CUBE}.book_id"
        type: count_distinct
      - name: avg_rating
        sql: "{dim_books.rating_average}"
        type: avg
      - name: avg_page_count
        sql: "{dim_books.page_count}"
        type: avg

    joins:
      - name: dim_authors
        relationship: many_to_one
        sql: "{CUBE}.author_id = {dim_authors.id}"
      - name: dim_books
        relationship: many_to_one
        sql: "{CUBE}.book_id = {dim_books.id}"

    pre_aggregations:
      - name: author_performance_rollup
        dimensions:
          - author_id
          - author_name
        measures:
          - books_published
          - avg_rating
          - avg_page_count
        time_dimension: created_at
        granularity: day
        refresh_key:
          every: 15 minutes
        partition_granularity: month
        indexes:
          - name: author_performance_author_id_index
            columns:
              - author_id
          - name: author_performance_author_name_index
            columns:
              - author_name

  - name: book_characteristics_performance
    extends: fct_sales
    dimensions:
      - name: book_length_category
        case:
          when:
            - sql: "{dim_books.page_count} < 200"
              label: "Short"
            - sql: "{dim_books.page_count} < 400"
              label: "Medium"
          else:
            label: "Long"
        type: string
        primary_key: true
        public: true
      - name: rating_category
        case:
          when:
            - sql: "{dim_books.rating_average} < 3"
              label: "Low Rating (< 3.0)"
            - sql: "{dim_books.rating_average} < 4"
              label: "Good Rating (3.0-4.0)"
          else:
            label: "Excellent Rating (> 4.0)"
        type: string
        primary_key: true
        public: true
      - name: created_at
        sql: "CAST({dim_dates.date} AS TIMESTAMP)"
        type: time

    measures:
      - name: book_count
        type: count
      - name: avg_units_sold
        sql: "{CUBE}.sales_quantity"
        type: avg
      - name: avg_revenue
        sql: "{CUBE}.extended_sales_amount"
        type: avg
      - name: avg_price
        sql: "{CUBE}.net_unit_price"
        type: avg

    joins:
      - name: dim_books
        relationship: one_to_one
        sql: "{CUBE}.book_key = {dim_books.book_key}"

    pre_aggregations:
      - name: book_characteristics_performance_rollup
        dimensions:
          - book_length_category
          - rating_category
        measures:
          - book_count
          - avg_units_sold
          - avg_revenue
          - avg_price
        time_dimension: created_at
        granularity: day
        refresh_key:
          every: 15 minutes
        partition_granularity: month
        indexes:
          - name: book_characteristics_performance_book_length_category_index
            columns:
              - book_length_category
          - name: book_characteristics_performance_rating_category_index
            columns:
              - rating_category
