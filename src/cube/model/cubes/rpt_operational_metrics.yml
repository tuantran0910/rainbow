cubes:
  - name: period_analysis
    extends: fct_sales
    dimensions:
      - name: day_name
        case:
          when:
            - sql: "{dim_dates.day_of_week} = 1"
              label: "Monday"
            - sql: "{dim_dates.day_of_week} = 2"
              label: "Tuesday"
            - sql: "{dim_dates.day_of_week} = 3"
              label: "Wednesday"
            - sql: "{dim_dates.day_of_week} = 4"
              label: "Thursday"
            - sql: "{dim_dates.day_of_week} = 5"
              label: "Friday"
            - sql: "{dim_dates.day_of_week} = 6"
              label: "Saturday"
            - sql: "{dim_dates.day_of_week} = 7"
              label: "Sunday"
          else:
            label: "Unknown"
        type: string
        primary_key: true
        public: true
      - name: created_at
        sql: "CAST({CUBE}.created_date_tz_hcm AS TIMESTAMP)"
        type: time

    measures:
      - name: total_orders
        sql: "{CUBE}.order_id"
        type: count_distinct
      - name: total_revenue
        sql: "{CUBE}.extended_sales_amount"
        type: sum
      - name: avg_order_value
        sql: "SUM({CUBE}.extended_sales_amount) / SUM({CUBE}.sales_quantity)"
        type: number

    joins:
      - name: dim_dates
        relationship: one_to_one
        sql: "{CUBE}.date_key = {dim_dates.date_key}"

    pre_aggregations:
      - name: period_analysis_rollup
        dimensions:
          - day_name
        measures:
          - total_orders
          - total_revenue
          - avg_order_value
        time_dimension: created_at
        granularity: day
        refresh_key:
          every: 15 minutes
        partition_granularity: month
        indexes:
          - name: period_analysis_day_name_index
            columns:
              - day_name
