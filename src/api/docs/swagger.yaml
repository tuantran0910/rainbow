basePath: /api/v1
definitions:
  dtos.CreateProductRequest:
    properties:
      name:
        maxLength: 255
        minLength: 3
        type: string
      price:
        type: number
    required:
    - name
    - price
    type: object
  dtos.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 255
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dtos.RegisterUserRequest:
    properties:
      email:
        type: string
      first_name:
        maxLength: 255
        minLength: 1
        type: string
      last_name:
        maxLength: 255
        minLength: 1
        type: string
      password:
        maxLength: 255
        minLength: 6
        type: string
      phone_number:
        type: string
      role:
        enum:
        - ADMIN
        - USER
        type: string
    required:
    - email
    - first_name
    - last_name
    - password
    - phone_number
    type: object
  dtos.UpdateProductRequest:
    properties:
      name:
        maxLength: 255
        minLength: 3
        type: string
      price:
        type: number
    type: object
  response.APIResponse:
    properties:
      data: {}
      error: {}
      headers: {}
      message:
        type: string
      pagination: {}
      status_code:
        type: integer
    type: object
host: localhost:5000
info:
  contact:
    email: tntuan0910@gmail.com
    name: tuan.tran
  description: This is the API documentation for the Rainbow API.
  license:
    name: MIT
    url: http://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Rainbow API
  version: "1.0"
paths:
  /login:
    post:
      consumes:
      - application/json
      description: Login to the system
      parameters:
      - description: Login User Request
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dtos.LoginUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Login
      tags:
      - Auth
  /products:
    get:
      consumes:
      - application/json
      description: Fetch a list of products
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Number of items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get Products
      tags:
      - Product
  /products/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a product by its ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Delete Product by ID
      tags:
      - Product
    get:
      consumes:
      - application/json
      description: Fetch a product by its ID
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Get Product by ID
      tags:
      - Product
    patch:
      consumes:
      - application/json
      description: Update a product by its ID
      parameters:
      - description: Update Product Request
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Update Product by ID
      tags:
      - Product
    post:
      consumes:
      - application/json
      description: Create a product
      parameters:
      - description: Create Product Request
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dtos.CreateProductRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Create Product
      tags:
      - Product
  /register:
    post:
      consumes:
      - application/json
      description: Register a new user
      parameters:
      - description: Register User Request
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dtos.RegisterUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.APIResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.APIResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.APIResponse'
      summary: Register
      tags:
      - Auth
swagger: "2.0"
