basePath: /api/v1
definitions:
  dtos.CreateCategoryRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
      - name
    type: object
  dtos.CreateProductRequest:
    properties:
      name:
        maxLength: 255
        minLength: 3
        type: string
      price:
        type: number
    required:
      - name
      - price
    type: object
  dtos.CreateSellerRequest:
    properties:
      link:
        type: string
      logo:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
      - name
    type: object
  dtos.LoginUserRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 255
        minLength: 6
        type: string
    required:
      - email
      - password
    type: object
  dtos.RegisterUserRequest:
    properties:
      email:
        type: string
      first_name:
        maxLength: 255
        minLength: 1
        type: string
      last_name:
        maxLength: 255
        minLength: 1
        type: string
      password:
        maxLength: 255
        minLength: 6
        type: string
      phone_number:
        type: string
      role:
        enum:
          - ADMIN
          - USER
        type: string
    required:
      - email
      - first_name
      - last_name
      - password
      - phone_number
    type: object
  dtos.UpdateCategoryRequest:
    properties:
      name:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  dtos.UpdateProductRequest:
    properties:
      name:
        maxLength: 255
        minLength: 3
        type: string
      price:
        type: number
    type: object
  dtos.UpdateSellerRequest:
    properties:
      logo:
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
    type: object
  dtos.UpdateUserRequest:
    properties:
      email:
        type: string
      first_name:
        maxLength: 255
        minLength: 1
        type: string
      is_active:
        type: boolean
      last_name:
        maxLength: 255
        minLength: 1
        type: string
      phone_number:
        type: string
      role:
        enum:
          - ADMIN
          - USER
        type: string
    type: object
  response.APIResponse:
    properties:
      data: {}
      error: {}
      headers: {}
      message:
        type: string
      pagination: {}
      status_code:
        type: integer
    type: object
