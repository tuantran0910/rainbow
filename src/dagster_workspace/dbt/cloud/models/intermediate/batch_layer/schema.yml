version: 2

models:
  - name: bri_book_authors__batch
    description: >
      This is a batch model for the bri_book_authors table.
      The model contains information about the authors of the books.
    columns:
      - name: book_author_key
        description: Surrogate key of the table
        data_type: STRING
        tests:
          - unique
          - not_null
      - name: book_id
        description: Primary key of the book table
        data_type: STRING
      - name: created_at
        description: The timestamp when the record was created
        data_type: TIMESTAMP
      - name: author_id
        description: Primary key of the author table
        data_type: STRING
      - name: updated_at
        description: The timestamp when the record was last updated
        data_type: TIMESTAMP
      - name: id
        description: Primary key of the book_authors table
        data_type: STRING
      - name: created_date_tz_hcm
        description: The date when the record was created
        data_type: DATE
      - name: updated_date_tz_hcm
        description: The date when the record was last updated
        data_type: DATE

