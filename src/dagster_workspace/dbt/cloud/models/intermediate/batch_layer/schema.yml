      - name: updated_date_tz_hcm
        description: The date when the record was last updated
        data_type: DATE
      - name: valid_from
        description: The timestamp when the record became valid
        data_type: TIMESTAMP
      - name: valid_to
        description: The timestamp when the record became invalid
        data_type: TIMESTAMP
      - name: is_current
        description: Flag indicating if the record is current
