storage:
  postgres:
    postgres_db:
      hostname:
        env: DB_HOST
      port:
        env: DB_PORT
      username:
        env: DAGSTER_DB_USER
      password:
        env: DAGSTER_DB_PASSWORD
      db_name:
        env: DAGSTER_DB_NAME

compute_logs:
  module: dagster_obstore.s3.compute_log_manager
  class: S3ComputeLogManager
  config:
    bucket:
      env: DAGSTER_COMPUTE_LOGS_BUCKET
    access_key_id:
      env: DAGSTER_COMPUTE_LOGS_ACCESS_KEY_ID
    secret_access_key:
      env: DAGSTER_COMPUTE_LOGS_SECRET_ACCESS_KEY
    local_dir: /tmp/dagster-compute-logs
    endpoint:
      env: DAGSTER_COMPUTE_LOGS_ENDPOINT_URL
    region: us-west-1
    timeout: 60s
    allow_http: true
    upload_interval: 30

local_artifact_storage:
  module: dagster.core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /tmp/dagster-artifacts

scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 5

run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher

telemetry:
  enabled: false

run_monitoring:
  enabled: true
  poll_interval_seconds: 60

run_retries:
  enabled: true
  max_retries: 3
  retry_on_asset_or_op_failure: true

code_servers:
  local_startup_timeout: 360

retention:
  schedule:
    purge_after_days: 90
  sensor:
    purge_after_days:
      skipped: 7
      failure: 30
      success: -1

sensors:
  use_threads: true
  num_workers: 8

schedules:
  use_threads: true
  num_workers: 8
