replicas: 1

labels:
  app: kafka-cluster
  owner: tuan.tran

# Strimzi Kafka Operator Configuration
watchNamespaces:
  - kafka

# Generate network policies
generateNetworkPolicy: false

# Image pull policy
image:
  pullPolicy: IfNotPresent

# Logging configuration
defaultLogLevel: INFO

# Resource limits for Strimzi operator
resources:
  limits:
    cpu: 1000m
    memory: 384Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# Node selector and tolerations
nodeSelector: {}
tolerations: []
affinity: {}
