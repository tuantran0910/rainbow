nameOverride: cube
fullnameOverride: cube
commonLabels:
  owner: tuan.tran

extraEnvVars:
  - name: USE_REMOTE_MANIFEST
    value: 'true'
  - name: DBT_GCS_PROJECT
    value: rainbow-data-production
  - name: DBT_GCS_BUCKET
    value: rainbow-data-production-dbt
  - name: MANIFEST_PATH
    value: docs/manifest.json

extraEnvVarsFromSecret: cube-secret

image:
  repository: ghcr.io/tuantran0910/rainbow/cube
  tag: 2025.06.22.0
  pullPolicy: IfNotPresent

config:
  apiPort: 4000
  pgSqlPort: 15432
  sqlUser: cubejs
  schemaPath: model
  rollupOnly: false
  scheduledRefreshTimezones: Asia/Ho_Chi_Minh
  preAggregationsSchema: cube_pre_aggregations
  concurrency: 4
  volumes:
    - name: git-data
      emptyDir: {}
    - name: sparse-checkout-config
      configMap:
        name: sparse-checkout-config
  volumeMounts:
    - name: git-data
      readOnly: true
      mountPath: /cube/conf/model
      subPath: src/cube/model
  initContainers:
    - image: registry.k8s.io/git-sync/git-sync:v4.3.0
      name: git-sync
      restartPolicy: Always
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: git-data
          mountPath: /git
        - name: sparse-checkout-config
          mountPath: /git-sparse-checkout
      env:
        - name: GITSYNC_REPO
          value: https://github.com/tuantran0910/rainbow
        - name: GITSYNC_BRANCH
          value: main
        - name: GITSYNC_ROOT
          value: /git
        - name: GITSYNC_DEST
          value: src
        - name: GITSYNC_SPARSE_CHECKOUT_FILE
          value: /git-sparse-checkout/sparse-checkout
        - name: GITSYNC_PERIOD
          value: 60s
        - name: GITSYNC_MAX_SYNC_FAILURES
          value: '5'
        - name: GITSYNC_VERBOSE
          value: '1'

datasources:
  default:
    type: bigquery
    bigquery:
      projectId: rainbow-data-production
      location: us-central1
    export:
      type: gcp
      name: rainbow-data-production-cubejs
  # Just for testing
  doris:
    type: mysql
    host: doris-cluster-fe-service.doris.svc.cluster.local
    port: 9030
    name: mysql
    user: cube
    password: cube

cubestore:
  host: cubestore-service

api:
  serviceAccount:
    create: false
    name: cube
    annotations:
      iam.gke.io/gcp-service-account: cube-sa@rainbow-data-production.iam.gserviceaccount.com
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false

worker:
  serviceAccount:
    create: false
    name: cube
    annotations:
      iam.gke.io/gcp-service-account: cube-sa@rainbow-data-production.iam.gserviceaccount.com
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
