nameOverride: cube
fullnameOverride: cube
commonLabels:
  owner: tuan.tran

extraEnvVars:
  - name: USE_REMOTE_MANIFEST
    value: 'true'
  - name: DBT_GCS_PROJECT
    value: rainbow-data-production
  - name: DBT_GCS_BUCKET
    value: rainbow-data-production-dbt
  - name: MANIFEST_PATH
    value: docs/manifest.json
  - name: CUBEJS_PRE_AGGREGATIONS_BUILDER
    value: 'true'
  - name: ENVIRONMENT
    value: production

extraEnvVarsFromSecret: cube-secret

image:
  repository: ghcr.io/tuantran0910/rainbow/cube
  tag: 2025.07.14.0
  pullPolicy: IfNotPresent

config:
  logLevel: info
  devMode: false
  apiPort: 4000
  pgSqlPort: 15432
  sqlUser: cubejs
  schemaPath: /cube/conf
  rollupOnly: false
  preAggregationsSchema: cube_pre_aggregations
  concurrency: 4
  volumes:
    - name: git-data
      emptyDir: {}
    - name: cube-config
      emptyDir: {}
    - name: sparse-checkout-config
      configMap:
        name: sparse-checkout-config
  volumeMounts:
    - name: cube-config
      readOnly: true
      mountPath: /cube/conf
    - name: git-data
      mountPath: /tmp/git
  initContainers:
    - image: registry.k8s.io/git-sync/git-sync:v4.3.0
      name: git-sync
      restartPolicy: Always
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: git-data
          mountPath: /tmp/git
        - name: sparse-checkout-config
          mountPath: /git-sparse-checkout
        - name: cube-config
          mountPath: /cube/conf
      env:
        - name: GITSYNC_REPO
          value: https://github.com/tuantran0910/rainbow
        - name: GITSYNC_BRANCH
          value: main
        - name: GITSYNC_ROOT
          value: /tmp/git
        - name: GITSYNC_DEST
          value: rainbow
        - name: GITSYNC_SPARSE_CHECKOUT_FILE
          value: /git-sparse-checkout/sparse-checkout
        - name: GITSYNC_PERIOD
          value: 60s
        - name: GITSYNC_MAX_SYNC_FAILURES
          value: '5'
        - name: GITSYNC_VERBOSE
          value: '1'
        - name: GITSYNC_DEPTH
          value: '1'
    - image: ghcr.io/tuantran0910/rainbow/base-alpine:2025.07.05.0
      name: copy-cube-models
      restartPolicy: Always
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: git-data
          mountPath: /tmp/git
        - name: cube-config
          mountPath: /cube/conf
      command: [/bin/bash]
      args:
        - -c
        - |
          # Function to copy files
          copy_files() {
            if [ -d "/tmp/git/rainbow/src/cube" ]; then
              echo "Copying cube files..."
              rm -rf /cube/conf/*
              cp -r /tmp/git/rainbow/src/cube/* /cube/conf/ 2>/dev/null || true
              # Create ready marker
              touch /cube/conf/.git-sync-ready
              echo "Copy completed at $(date)"
            else
              echo "Source directory not found: /tmp/git/rainbow/src/cube"
            fi
          }

          # Initial copy
          echo "Waiting for initial git-sync..."
          while [ ! -d "/tmp/git/rainbow/src/cube" ]; do
            sleep 5
          done
          copy_files

          # Set up inotify to watch for changes
          if command -v inotifywait >/dev/null 2>&1; then
            echo "Setting up file watcher..."
            while true; do
              inotifywait -r -e modify,create,delete,move /tmp/git/rainbow/src/cube/ 2>/dev/null || sleep 60
              copy_files
            done
          else
            # Fallback: periodic copy
            echo "Using periodic copy (every 60s)..."
            while true; do
              sleep 60
              copy_files
            done
          fi

datasources:
  default:
    type: bigquery
    bigquery:
      projectId: rainbow-data-production
      location: US
    export:
      type: gcp
      name: rainbow-data-production-cubejs

cubestore:
  host: cubestore-router

api:
  serviceAccount:
    create: false
    name: cube
    annotations:
      iam.gke.io/gcp-service-account: cube-sa@rainbow-data-production.iam.gserviceaccount.com
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 500m
      memory: 2048Mi
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false

worker:
  serviceAccount:
    create: false
    name: cube
    annotations:
      iam.gke.io/gcp-service-account: cube-sa@rainbow-data-production.iam.gserviceaccount.com
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 500m
      memory: 2048Mi
  livenessProbe:
    enabled: false
  readinessProbe:
    enabled: false
