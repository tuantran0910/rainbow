# Cubejs Application Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cube
helmGlobals:
  chartHome: /tmp/charts
helmCharts:
  - name: cubestore
    repo: https://gadsme.github.io/charts
    version: 1.0.0
    releaseName: cubestore
    valuesFile: values.yaml
