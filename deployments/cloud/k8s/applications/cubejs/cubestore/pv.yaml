apiVersion: v1
kind: PersistentVolume
metadata:
  name: cubestore-gcs-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: gcsfuse-static
  mountOptions:
    - implicit-dirs
  csi:
    driver: gcsfuse.csi.storage.gke.io
    volumeHandle: cubestore
    volumeAttributes:
      bucketName: rainbow-data-production-cubejs
  claimRef:
    name: cubestore-remote-storage
    namespace: cube
