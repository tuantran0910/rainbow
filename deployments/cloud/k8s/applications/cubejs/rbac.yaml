apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: cube
  name: cube-deployment-restarter
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list]
    resourceNames: [cube-api, cube-refresh-worker]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [patch]
    resourceNames: [cube-api, cube-refresh-worker]
  - apiGroups: [apps]
    resources: [deployments/status, replicasets]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-reader
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-cube-deployment-restarter
  namespace: cube
subjects:
  - kind: User
    name: github-actions-deployer@rainbow-data-production.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: cube-deployment-restarter
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-actions-namespace-reader
subjects:
  - kind: User
    name: github-actions-deployer@rainbow-data-production.iam.gserviceaccount.com
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: namespace-reader
  apiGroup: rbac.authorization.k8s.io
