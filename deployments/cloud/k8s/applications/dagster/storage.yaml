apiVersion: storage.cnrm.cloud.google.com/v1beta1
kind: StorageBucket
metadata:
  name: rainbow-data-production-dagster
  namespace: dagster
  annotations:
    cnrm.cloud.google.com/project-id: rainbow-data-production
spec:
  resourceID: rainbow-data-production-dagster
  location: us-central1
  storageClass: standard
  lifecycleRule:
    - action:
        type: Delete
      condition:
        age: 365
  publicAccessPrevention: enforced
