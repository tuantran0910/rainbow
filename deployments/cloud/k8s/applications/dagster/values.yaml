global:
  serviceAccountName: dagster

nameOverride: dagster
fullnameOverride: dagster

####################################################################################################
# Dagster Webserver Configuration
####################################################################################################
dagsterWebserver:
  replicaCount: 1
  image:
    repository: ghcr.io/tuantran0910/rainbow/dagster-core
    tag: 2025.06.22.0
    pullPolicy: Always
  service:
    type: NodePort
    port: 3000
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
  workspace:
    enabled: true
    servers:
      - host: rainbow-dagster-workspace
        port: 4000
        name: rainbow-dagster-workspace
  dbStatementTimeout: 300
  dbPoolRecycle: 300
  dbPoolMaxOverflow: 10
  deploymentLabels:
    app: dagster
    owner: tuan.tran
  labels:
    app: dagster
    owner: tuan.tran
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  readinessProbe:
    httpGet:
      path: /server_info
      port: 3000
    periodSeconds: 20
    timeoutSeconds: 10
    failureThreshold: 3
  extraContainers:
    - name: cloud-sql-proxy
      image: asia.gcr.io/cloud-sql-connectors/cloud-sql-proxy
      args:
        - --structured-logs
        - --auto-iam-authn
        - --private-ip
        - rainbow-data-production:us-west1:rainbow-data-production-db?port=5432
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
  checkDbReadyInitContainer: false

####################################################################################################
# Compute Log Manager: GCS Configuration for log storage
####################################################################################################
computeLogManager:
  type: GCSComputeLogManager
  config:
    gcsComputeLogManager:
      bucket: rainbow-data-production-dagster
      localDir: /tmp/dagster-logs
      prefix: compute-logs
      uploadInterval: 30

####################################################################################################
# Dagster User Deployment
####################################################################################################
dagster-user-deployments:
  enabled: true
  deployments:
    - name: rainbow-dagster-workspace
      image:
        repository: ghcr.io/tuantran0910/rainbow/dagster-workspace
        tag: 2025.06.29.0
        pullPolicy: Always
      codeServerArgs:
        - -m
        - definitions
      port: 4000
      includeConfigInLaunchedRuns:
        enabled: false
      envConfigMaps:
        - name: dagster-config-map
      envSecrets:
        - name: dagster-secrets
      labels:
        app: dagster
        owner: tuan.tran
      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 200m
          memory: 256Mi
      sidecarContainers:
        - name: cloud-sql-proxy
          image: asia.gcr.io/cloud-sql-connectors/cloud-sql-proxy
          args:
            - --structured-logs
            - --auto-iam-authn
            - --private-ip
            - rainbow-data-production:us-west1:rainbow-data-production-db?port=5432
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
      readinessProbe:
        enabled: false
      startupProbe:
        enabled: false

####################################################################################################
# Scheduler Configuration
####################################################################################################
scheduler:
  type: DagsterDaemonScheduler

####################################################################################################
# Run Launcher: Kubernetes-based job execution
####################################################################################################
runLauncher:
  type: K8sRunLauncher
  config:
    k8sRunLauncher:
      jobNamespace: dagster
      envConfigMaps:
        - name: dagster-config-map
      envSecrets:
        - name: dagster-secrets
      labels:
        app: dagster
        owner: tuan.tran
      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 256Mi
      runK8sConfig:
        jobSpecConfig:
          ttlSecondsAfterFinished: 300

####################################################################################################
# PostgreSQL: Configuration values for postgresql
####################################################################################################
postgresql:
  enabled: false
  postgresqlHost: localhost
  postgresqlPort: 5432
  postgresqlUsername: dagster-sa@rainbow-data-production.iam
  postgresqlPassword: ''
  postgresqlDatabase: dagster

generatePostgresqlPasswordSecret: false

####################################################################################################
# Dagster Daemon: Background processes for schedules, sensors, and run coordination
####################################################################################################
dagsterDaemon:
  enabled: true
  image:
    repository: ghcr.io/tuantran0910/rainbow/dagster-core
    tag: 2025.06.14.1
  runCoordinator:
    type: QueuedRunCoordinator
    config:
      maxConcurrentRuns: 5
  labels:
    app: dagster
    owner: tuan.tran
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  extraContainers:
    - name: cloud-sql-proxy
      image: asia.gcr.io/cloud-sql-connectors/cloud-sql-proxy
      args:
        - --structured-logs
        - --auto-iam-authn
        - --private-ip
        - rainbow-data-production:us-west1:rainbow-data-production-db?port=5432
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
  checkDbReadyInitContainer: false

####################################################################################################
# Service Account Configuration
####################################################################################################
serviceAccount:
  create: false
  name: dagster
  annotations:
    iam.gke.io/gcp-service-account: dagster-sa@rainbow-data-production.iam.gserviceaccount.com

####################################################################################################
# Ingress: Enable for external access
####################################################################################################
ingress:
  enabled: false
