nameOverride: superset
fullnameOverride: superset
extraLabels:
  owner: tuan.tran

runAsUser: 1000

serviceAccountName: superset
serviceAccount:
  create: false
  annotations:
    iam.gke.io/gcp-service-account: superset-sa@rainbow-data-production.iam.gserviceaccount.com

bootstrapScript: |
  # Create bootstrap file if it doesn't exist
  if [ ! -f ~/bootstrap ]; then
    echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap
  fi

extraConfigs:
  import_datasources.yaml: |
    databases:
    - database_name: superset
      sqlalchemy_uri: postgresql+psycopg2://superset-sa%40rainbow-data-production.iam@localhost:5432/superset

configOverrides:
  extend_timeout: |
    SUPERSET_WEBSERVER_TIMEOUT = 150
  secret: |
    SECRET_KEY = "iq4Pz2aVUDoDE+zbx5zp+NH9Cl5X38L3OywAIBiq4HPJhSyyI8DvplG2"

image:
  repository: ghcr.io/tuantran0910/rainbow/superset
  tag: 2025.06.16.0
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8088
  nodePort:
    http: 30088
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 2Gi

supersetNode:
  replicas:
    replicaCount: 1
  connections:
    # TODO: Change from Redis to Dragonfly
    # redis_host: dragonfly-master.dragonfly.svc.cluster.local
    # redis_port: 6379
    # redis_user: superset
    # redis_password: ""
    db_host: 127.0.0.1
    db_port: 5432
    db_user: superset-sa@rainbow-data-production.iam
    db_pass: ''
    db_name: superset
  initContainers:
    - name: cloud-sql-proxy
      image: asia.gcr.io/cloud-sql-connectors/cloud-sql-proxy
      args:
        - --structured-logs
        - --auto-iam-authn
        - --private-ip
        - rainbow-data-production:us-west1:rainbow-data-production-db?port=5432
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
  podSecurityContext:
    fsGroup: 65532
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]

supersetWorker:
  replicas:
    replicaCount: 1
  initContainers:
    - name: cloud-sql-proxy
      image: asia.gcr.io/cloud-sql-connectors/cloud-sql-proxy
      args:
        - --structured-logs
        - --auto-iam-authn
        - --private-ip
        - rainbow-data-production:us-west1:rainbow-data-production-db?port=5432
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop: [ALL]
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
  podSecurityContext:
    fsGroup: 65532
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]

supersetCeleryBeat:
  enabled: true
  initContainers:
    - name: cloud-sql-proxy
      image: asia.gcr.io/cloud-sql-connectors/cloud-sql-proxy
      args:
