nameOverride: superset
fullnameOverride: superset
extraLabels:
  owner: tuan.tran

runAsUser: 1000

serviceAccountName: superset
serviceAccount:
  create: false
  annotations:
    iam.gke.io/gcp-service-account: superset-sa@rainbow-data-production.iam.gserviceaccount.com

bootstrapScript: |
  # Create bootstrap file if it doesn't exist
  if [ ! -f ~/bootstrap ]; then
    echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap
  fi

envFromSecrets:
  - superset-secrets

configOverrides:
  extend_timeout: |
    SUPERSET_WEBSERVER_TIMEOUT = 150
  secret: |
    SECRET_KEY = os.environ.get("SUPERSET_SECRET_KEY")
  enable_oauth: |
    from flask_appbuilder.security.manager import AUTH_OAUTH
    from superset.security import SupersetSecurityManager

    AUTH_TYPE = AUTH_OAUTH
    ENABLE_PROXY_FIX = True

    OAUTH_PROVIDERS = [
        {
            "name": "github",
            "token_key": "access_token",
            "icon": "fa-github",
            "remote_app": {
                "client_id": os.environ.get("GITHUB_CLIENT_ID"),
                "client_secret": os.environ.get("GITHUB_CLIENT_SECRET"),
                "client_kwargs": {
                    "scope": "user:email"
                },
                "api_base_url": "https://api.github.com/",
                "access_token_url": "https://github.com/login/oauth/access_token",
                "authorize_url": "https://github.com/login/oauth/authorize",
            }
        }
    ]

    AUTH_USER_REGISTRATION = True
    AUTH_USER_REGISTRATION_ROLE = "Public"

    # Define user role mapping based on GitHub username
    # There are roles: Admin, Alpha, Gamma, sql_lab, Public
    USER_ROLE_MAPPING = {
        "tuantran0910": "Admin",
    }

    class CustomSecurityManager(SupersetSecurityManager):
        def oauth_user_info(self, provider, response=None):
            if provider == "github":
                me = self.appbuilder.sm.oauth_remotes[provider].get("user")
                data = me.json()

                emails = self.appbuilder.sm.oauth_remotes[provider].get("user/emails")
                primary_email = None
                for email in emails.json():
                    if email.get("primary", False):
                        primary_email = email["email"]
                        break

                return {
                    "username": data.get("login"),
                    "first_name": data.get("name", "").split(" ")[0] if data.get("name") else data.get("login"),
                    "last_name": " ".join(data.get("name", "").split(" ")[1:]) if data.get("name") and len(data.get("name", "").split(" ")) > 1 else "",
                    "email": primary_email or data.get("email"),
                }
            return {}

        def auth_user_oauth(self, userinfo):
            user = super().auth_user_oauth(userinfo)
            if user:
                username = userinfo.get("username")
                if username in USER_ROLE_MAPPING:
                    role_name = USER_ROLE_MAPPING[username]
                    role = self.find_role(role_name)
                    if role and role not in user.roles:
                        user.roles = [role]
                        self.get_session.merge(user)
                        self.get_session.commit()
            return user

    CUSTOM_SECURITY_MANAGER = CustomSecurityManager

image:
  repository: ghcr.io/tuantran0910/rainbow/superset
  tag: 2025.07.03.0
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8088
  nodePort:
    http: 30088
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1
    memory: 2Gi

supersetNode:
  replicas:
    replicaCount: 1
  connections:
    # TODO: Change from Redis to Dragonfly
    # redis_host: dragonfly-master.dragonfly.svc.cluster.local
    # redis_port: 6379
    # redis_user: superset
    # redis_password: ""
    db_host: 127.0.0.1
    db_port: 5432
    db_user: superset-sa@rainbow-data-production.iam
    db_pass: ''
    db_name: superset
  initContainers:
    - name: cloud-sql-proxy
      image: asia.gcr.io/cloud-sql-connectors/cloud-sql-proxy
      args:
        - --structured-logs
        - --auto-iam-authn
        - --private-ip
        - rainbow-data-production:us-west1:rainbow-data-production-db?port=5432
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
      resources:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 50m
          memory: 64Mi
  podSecurityContext:
    fsGroup: 65532
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop: [ALL]

