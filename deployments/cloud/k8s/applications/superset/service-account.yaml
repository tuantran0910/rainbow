apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMServiceAccount
metadata:
  name: superset-gsa
  namespace: superset
  annotations:
    cnrm.cloud.google.com/project-id: rainbow-data-production
spec:
  resourceID: superset-sa
  displayName: Superset Service Account
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: superset-cloudsql-client
  namespace: superset
spec:
  member: serviceAccount:superset-sa@rainbow-data-production.iam.gserviceaccount.com
  role: roles/cloudsql.client
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: rainbow-data-production
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: superset-cloudsql-instance-user
  namespace: superset
spec:
  member: serviceAccount:superset-sa@rainbow-data-production.iam.gserviceaccount.com
  role: roles/cloudsql.instanceUser
  resourceRef:
    apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
    kind: Project
    external: rainbow-data-production
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superset
  namespace: superset
  annotations:
    iam.gke.io/gcp-service-account: superset-sa@rainbow-data-production.iam.gserviceaccount.com
---
apiVersion: iam.cnrm.cloud.google.com/v1beta1
kind: IAMPolicyMember
metadata:
  name: superset-workload-identity
  namespace: superset
spec:
  member: serviceAccount:rainbow-data-production.svc.id.goog[superset/superset]
  role: roles/iam.workloadIdentityUser
  resourceRef:
    apiVersion: iam.cnrm.cloud.google.com/v1beta1
    kind: IAMServiceAccount
    name: superset-gsa
