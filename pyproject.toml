[project]
name = "rainbow"
version = "0.1.0"
description = "Simple data platform project"
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "tuan.tran", email = "tntuan0910@gmail.com" }]
keywords = ["data", "platform", "rainbow"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

######################################
# THIRD PARTY TOOLS
######################################

[tool.mypy]
ignore_missing_imports = true
disallow_subclassing_any = false

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = ["C901", "D300", "I", "F"]
ignore = ["F541", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.sqlfluff.core]
dialect = "ansi"
templater = "jinja"
sql_file_exts = ".sql,.sql.j2,.dml,.ddl"
exclude_rules = "L014,L016,L020,L026,L027,L028,L029,L031,L032,L034,L037,L042,L044,L051,CP03,AL02,LT01,LT02,LT09,AL05"
runaway_limit = 100
ignore = "parsing,templating"
large_file_skip_byte_limit = 100000

[tool.sqlfluff.templater.jinja]
apply_dbt_builtins = true

[tool.sqlfluff.templater.dbt]
project_dir = "./src/dbt"
profiles_dir = "./src/dbt"
profile = "default"

[tool.sqlfluff.indentation]
indented_ctes = true
indented_joins = false
indented_using_on = true
template_blocks_indent = true

[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.identifiers]
capitalisation_policy = "upper"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "upper"

[tool.sqlfluff.rules.references.special_chars]
allow_space_in_identifier = true
additional_allowed_characters = ['.', '(', ')', '-']

[tool.sqlfluff.rules.aliasing.length]
min_alias_length = 4

[tool.uv.workspace]
members = ["src/dagster_core/local", "src/dagster_core/cloud", "src/dagster_workspace", "src/dagster_workspace/dbt/cloud", "src/dagster_workspace/dbt/local"]

[dependency-groups]
docs = [
    "mkdocs-git-authors-plugin>=0.9.2",
    "mkdocs-git-revision-date-localized-plugin>=1.3.0",
    "mkdocs-material>=9.5.50",
]
dev = [
    "ipykernel>=6.29.5",
    "pre-commit>=4.1.0",
    "reorder-python-imports>=3.14.0",
    "sqlfluff>=3.4.0",
]
